    version: 1.2.0
    source: https://github.com/livetennisapi/livetennisapi-php/blob/v1.2.0/src/LiveTennisApi.php
  dotnet:
    label: .NET
    lang: csharp
    version: 1.2.1
    source: https://github.com/livetennisapi/livetennisapi-dotnet/blob/v1.2.1/src/LiveTennisApi/LiveTennisApiClient.cs
  dart:
    label: Dart
    lang: dart
    version: 1.2.1
    source: https://github.com/livetennisapi/livetennisapi-dart/blob/v1.2.1/lib/src/client.dart
  swift:
    label: Swift
    lang: swift
    version: 1.2.1
    source: https://github.com/livetennisapi/livetennisapi-swift/blob/v1.2.1/Sources/LiveTennisApi/LiveTennisApiClient.swift
  r:
    label: R
    lang: r
    version: 0.2.1
    source: https://github.com/livetennisapi/livetennisapi-r/blob/v0.2.1/R/endpoints.R

