# Which method of each official client calls each operation in openapi.yaml.
#
# scripts/build_code_samples.py reads this file and writes the x-codeSamples
# block of every operation: a curl call plus one sample per client listed here.
# Every operationId in the spec needs an entry, and every entry needs an
# operationId the spec defines. The build fails otherwise.
#
# Each method name and argument list below was read from the client's source
# at the version under `clients`, never from its main branch. A client with no
# method for an operation has no line in that operation's entry, and the docs
# show no sample in that language. Do not add one the client does not have.
#
# Per operation:
#   result  the variable that holds the answer, in snake_case. Each language
#           spells it in its own style.
#   params  the values the curl sample sends: every path parameter, every
#           required query parameter and any optional one the clients pass.
#   body    the JSON body of the curl sample, for POST.
#   <client> the call after `client.` (`client->` in PHP). R functions are
#           called on their own. The value is the call itself, or a map with
#           `call` and one of these keys.
#             print    What the sample prints, when it is not the result.
#             returns  `error` for a Go method that returns only an error.
#
# The example values come from the client READMEs and the docs pages. They are
# match 18953, player 1104, tournament 12158 and the period 2026-07, plus the
# names nadal, borg, federer, graf and sampras. Ids the docs never show
# (archive, rally, charting and webhook ids) are 1. Replace them with an id
# from the matching list call.

clients:
  python:
    label: Python
    lang: python
    version: 1.8.0
    source: https://github.com/livetennisapi/livetennisapi-python/blob/v1.8.0/src/livetennisapi/client.py
  js:
    label: JavaScript
    lang: javascript
    version: 1.10.2
    # 1.10.2 has no tag. This is the commit the npm tarball was built from.
    source: https://github.com/livetennisapi/livetennisapi-js/blob/a5db420/src/client.ts
  go:
    label: Go
    lang: go
    version: 1.3.0
    source: https://github.com/livetennisapi/livetennisapi-go/blob/v1.3.0/endpoints.go
  php:
